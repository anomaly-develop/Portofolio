<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .mine-grid { fill: none; stroke: #16242E; stroke-width: 0.5; }
      .mine-cell { fill: #0E1720; stroke: #EFE7D6; stroke-width: 0.5; }
      .mine-revealed { fill: #16242E; }
      .mine-flag { fill: #A9503A; }
      .mine-number { fill: #C9A35B; font-family: "JetBrains Mono", monospace; font-size: 18px; text-anchor: middle; dominant-baseline: middle; }
      .mine-bomb { fill: #EFE7D6; }
    </style>
  </defs>
  
  <!-- Grid lines only - 16x12 -->
  <g class="mine-grid">
    <line x1="60" y1="40" x2="700" y2="40"/>
    <line x1="60" y1="80" x2="700" y2="80"/>
    <line x1="60" y1="120" x2="700" y2="120"/>
    <line x1="60" y1="160" x2="700" y2="160"/>
    <line x1="60" y1="200" x2="700" y2="200"/>
    <line x1="60" y1="240" x2="700" y2="240"/>
    <line x1="60" y1="280" x2="700" y2="280"/>
    <line x1="60" y1="320" x2="700" y2="320"/>
    <line x1="60" y1="360" x2="700" y2="360"/>
    <line x1="60" y1="400" x2="700" y2="400"/>
    <line x1="60" y1="440" x2="700" y2="440"/>
    <line x1="60" y1="480" x2="700" y2="480"/>
    <line x1="60" y1="520" x2="700" y2="520"/>
    <line x1="60" y1="560" x2="700" y2="560"/>
    <line x1="60" y1="600" x2="700" y2="600"/>
    <line x1="60" y1="40" x2="60" y2="600"/>
    <line x1="100" y1="40" x2="100" y2="600"/>
    <line x1="140" y1="40" x2="140" y2="600"/>
    <line x1="180" y1="40" x2="180" y2="600"/>
    <line x1="220" y1="40" x2="220" y2="600"/>
    <line x1="260" y1="40" x2="260" y2="600"/>
    <line x1="300" y1="40" x2="300" y2="600"/>
    <line x1="340" y1="40" x2="340" y2="600"/>
    <line x1="380" y1="40" x2="380" y2="600"/>
    <line x1="420" y1="40" x2="420" y2="600"/>
    <line x1="460" y1="40" x2="460" y2="600"/>
    <line x1="500" y1="40" x2="500" y2="600"/>
    <line x1="540" y1="40" x2="540" y2="600"/>
    <line x1="580" y1="40" x2="580" y2="600"/>
    <line x1="620" y1="40" x2="620" y2="600"/>
    <line x1="660" y1="40" x2="660" y2="600"/>
    <line x1="700" y1="40" x2="700" y2="600"/>
  </g>
  
  <!-- Key revealed cells with numbers -->
  <rect class="mine-cell mine-revealed" x="100" y="40" width="40" height="40"/>
  <text class="mine-number" x="120" y="62">1</text>
  <rect class="mine-cell mine-revealed" x="140" y="40" width="40" height="40"/>
  <text class="mine-number" x="160" y="62">2</text>
  <rect class="mine-cell mine-revealed" x="260" y="40" width="40" height="40"/>
  <text class="mine-number" x="280" y="62">1</text>
  
  <rect class="mine-cell mine-revealed" x="100" y="80" width="40" height="40"/>
  <text class="mine-number" x="120" y="102">2</text>
  <rect class="mine-cell mine-flag" x="140" y="80" width="40" height="40"/>
  <polygon class="mine-flag" points="160,55 160,105 190,80"/>
  <rect class="mine-cell mine-revealed" x="260" y="80" width="40" height="40"/>
  <text class="mine-number" x="280" y="102">2</text>
  
  <rect class="mine-cell mine-revealed" x="100" y="120" width="40" height="40"/>
  <text class="mine-number" x="120" y="142">1</text>
  <rect class="mine-cell mine-bomb" x="140" y="120" width="40" height="40"/>
  <circle class="mine-bomb" cx="160" cy="140" r="10"/>
  <rect class="mine-cell mine-revealed" x="260" y="120" width="40" height="40"/>
  <text class="mine-number" x="280" y="142">1</text>
  
  <rect class="mine-cell mine-revealed" x="100" y="160" width="40" height="40"/>
  <text class="mine-number" x="120" y="182">1</text>
  <rect class="mine-cell mine-revealed" x="140" y="160" width="40" height="40"/>
  <text class="mine-number" x="160" y="182">1</text>
  <rect class="mine-cell mine-revealed" x="260" y="160" width="40" height="40"/>
  <text class="mine-number" x="280" y="182">1</text>
</svg>