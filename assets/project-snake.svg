<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .grid-line { fill: none; stroke: #16242E; stroke-width: 0.5; }
      .snake-path { fill: none; stroke: #C9A35B; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .snake-head { fill: #C9A35B; }
      .snake-segment { fill: #C9A35B; opacity: 0.7; }
    </style>
  </defs>
  <!-- Subtle grid background -->
  <g class="grid-line">
    <line x1="0" y1="0" x2="800" y2="0"/>
    <line x1="0" y1="40" x2="800" y2="40"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
