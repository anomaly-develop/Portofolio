  <!-- Snake path - abstract winding path -->
  <path class="snake-path" d="M100,300 Q180,250 260,300 Q340,350 420,300 Q500,250 580,300 Q660,350 740,300"/>
  
  <!-- Snake segments along path -->
  <circle class="snake-head" cx="100" cy="300" r="18"/>
